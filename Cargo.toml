[package]
name = "bm25-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "BM25 search over stdin, a file, or a URL. No index, no config."
license = "MIT"
readme = "README.md"
repository = "https://github.com/satoric-tech/bm25-cli"
keywords = ["search", "bm25", "full-text-search", "cli", "tantivy"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "bm25"
path = "src/main.rs"

[lib]
name = "bm25_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tantivy = "0.26"
ignore = "0.4"
readability = "0.3"
htmd = "0.5"
reqwest = { version = "0.12", features = ["blocking"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
